<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio Readiness</title>

<!-- PWA: lets this be added to the home screen and opened full-screen, no browser chrome -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#171717" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Portfolio" />

<!-- React, loaded as plain global scripts so the bundle below doesn't need to include it -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<!-- Tailwind's browser build: compiles the utility classes on the fly, no build step needed -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase, "compat" build: exposes a plain window.firebase global, matching how
     React/ReactDOM are loaded above — everyone who opens this page reads/writes the
     same shared Realtime Database. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<!-- SheetJS: reads uploaded .xlsx bank statements client-side (loan statement upload). -->
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- Tesseract.js: reads text out of uploaded fund-price screenshots client-side (OCR), no server. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/7.0.0/tesseract.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #fafaf9; }
  * { box-sizing: border-box; }

  /* Below the sm breakpoint (640px), tables in .rtable render as a
     stacked list of cards (one per row) instead of a wide table you have
     to scroll sideways to read — each cell's data-label attribute becomes
     its on-card caption. */
  @media (max-width: 639px) {
    .rtable table { width: 100%; }
    .rtable thead { display: none; }
    .rtable tbody, .rtable tfoot, .rtable tr, .rtable td { display: block; width: 100%; }
    .rtable tfoot tr { border: 1px solid #e5e5e5; border-top: 2px solid #171717; border-radius: 8px; padding: 6px 10px; margin-top: 4px; }
    .rtable tr {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 10px;
    }
    .rtable td {
      border-bottom: 1px solid #f5f5f5;
      padding: 7px 0;
      text-align: right;
      position: relative;
      min-height: 1.5em;
      width: auto !important;
    }
    .rtable td:last-child { border-bottom: none; }
    .rtable td[data-label] { padding-left: 45%; }
    .rtable td[data-label]::before {
      content: attr(data-label);
      position: absolute;
      left: 0;
      top: 7px;
      width: 42%;
      padding-right: 8px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #a3a3a3;
      white-space: normal;
    }
  }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif;color:#737373;">
    Loading…
  </div>
</div>
<!-- bump ?v= on every bundle.js change, or Safari keeps serving the cached old copy -->
<script src="bundle.js?v=86"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
