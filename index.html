<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio Readiness</title>

<!-- PWA: lets this be added to the home screen and opened full-screen, no browser chrome -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#171717" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Portfolio" />

<!-- React, loaded as plain global scripts so the bundle below doesn't need to include it -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<!-- Tailwind's browser build: compiles the utility classes on the fly, no build step needed -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase, "compat" build: exposes a plain window.firebase global, matching how
     React/ReactDOM are loaded above — everyone who opens this page reads/writes the
     same shared Realtime Database. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #fafaf9; }
  * { box-sizing: border-box; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .animate-fade-in-up {
    animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .animate-fade-in {
    animation: fadeIn 0.4s ease-out both;
  }
  .animate-pop-in {
    animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif;color:#737373;">
    Loading…
  </div>
</div>
<script src="bundle.js"></script>
</body>
</html>
