name: Weekly portfolio digest email

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Compose and send weekly digest
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail

          FIREBASE_API_KEY="AIzaSyCTbnNaSbxN57izkccidiiPh2WLInyc-hI"
          # Same low-privilege "service" account used by update-rates.yml and
          # daily-alert-check.yml — read-only here, already granted by the rules.
          ID_TOKEN=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"rates-bot@portfolio.local","password":"o7TM8sgbx3sEqTRi92DgtsUL","returnSecureToken":true}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}" \
            | jq -r '.idToken')

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "Failed to get a Firebase auth token, aborting."
            exit 1
          fi

          if [ -z "${MAIL_USERNAME:-}" ] || [ -z "${MAIL_APP_PASSWORD:-}" ] || [ -z "${MAIL_TO:-}" ]; then
            echo "MAIL_USERNAME/MAIL_APP_PASSWORD/MAIL_TO secrets aren't set yet — skipping digest."
            exit 0
          fi

          DB="https://portfolio-8ac1d-default-rtdb.firebaseio.com"
          DAILY=$(curl -sf "${DB}/daily.json?auth=${ID_TOKEN}")
          LOANS=$(curl -sf "${DB}/loans.json?auth=${ID_TOKEN}")
          HOLDINGS=$(curl -sf "${DB}/holdings.json?auth=${ID_TOKEN}")
          MARKET_HISTORY=$(curl -sf "${DB}/marketHistory.json?auth=${ID_TOKEN}" || echo "null")
          # certificates/loanFacilities live in Firebase now (the site's upload
          # features write there directly), not hardcoded here — read them fresh
          # each run so a statement upload is reflected in this digest with no
          # separate file to keep in sync by hand.
          CERTS=$(curl -sf "${DB}/certificates.json?auth=${ID_TOKEN}" || echo "null")
          LOAN_FACS=$(curl -sf "${DB}/loanFacilities.json?auth=${ID_TOKEN}" || echo "null")

          # Valuation math mirrors computeDay/dailyAlert in bundle.js. The
          # office installment schedule below has no upload feature yet so it
          # stays hardcoded here — keep it in sync with bundle.js and
          # daily-alert-check.yml if that schedule ever changes.
          BODY=$(node -e '
            const daily = JSON.parse(process.argv[1]) || {};
            const loans = JSON.parse(process.argv[2]) || {};
            const holdings = JSON.parse(process.argv[3]) || {};
            const marketHistory = JSON.parse(process.argv[4]) || {};
            const CERTIFICATES = JSON.parse(process.argv[5] || "null") || [];
            const LOAN_FACILITIES = JSON.parse(process.argv[6] || "null") || [];
            const days = Object.values(daily).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));
            const latest = days[days.length - 1];
            if (!latest) { console.log("No daily entries recorded yet — nothing to report."); process.exit(0); }
            function computeAssets(entry) {
              const rate = Number(entry.rate) || 0;
              const goldPrice = Number(entry.gold) || 0;
              let total = 0;
              Object.values(holdings).filter(Boolean).forEach((h) => {
                if (h.type === "fund") {
                  const raw = entry[h.navGroup];
                  const nav = raw !== undefined && raw !== "" ? Number(raw) : h.purchaseNav;
                  const current = h.purchaseNav ? (h.investment / h.purchaseNav) * nav : 0;
                  total += h.currency === "USD" ? current * rate : current;
                } else if (h.type === "gold") {
                  total += goldPrice * (h.grams || 0);
                } else {
                  total += h.currency === "USD" ? h.investment * rate : h.investment;
                }
              });
              return total;
            }
            const totalAssets = computeAssets(latest);
            const totalLiabilities = Object.values(loans).filter(Boolean).reduce(
              (s, l) => s + (l.currency === "USD" ? l.amount * (Number(latest.rate) || 0) : l.amount), 0
            );
            const netWorth = totalAssets - totalLiabilities;
            const leverage = totalAssets ? (totalLiabilities / totalAssets) * 100 : 0;
            const prevDay = days.length > 1 ? days[days.length - 2] : null;
            let leverageDelta = null, rateDelta = null, goldDelta = null;
            if (prevDay) {
              const prevAssets = computeAssets(prevDay);
              const prevLiabilities = Object.values(loans).filter(Boolean).reduce(
                (s, l) => s + (l.currency === "USD" ? l.amount * (Number(prevDay.rate) || 0) : l.amount), 0
              );
              const prevLeverage = prevAssets ? (prevLiabilities / prevAssets) * 100 : 0;
              leverageDelta = leverage - prevLeverage;
              rateDelta = Number(prevDay.rate) ? ((Number(latest.rate) - Number(prevDay.rate)) / Number(prevDay.rate)) * 100 : null;
              goldDelta = Number(prevDay.gold) ? ((Number(latest.gold) - Number(prevDay.gold)) / Number(prevDay.gold)) * 100 : null;
            }
            const fmt = (n) => Math.round(n).toLocaleString("en-US");
            const signedPct = (n) => n === null ? null : `${n >= 0 ? "+" : "−"}${Math.abs(n).toFixed(1)}%`;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const daysUntil = (d) => d ? Math.round((new Date(d + "T00:00:00") - today) / 864e5) : null;
            const matured = CERTIFICATES.filter((c) => { const d = daysUntil(c.maturityDate); return d !== null && d < 0; });
            const soon = CERTIFICATES.filter((c) => { const d = daysUntil(c.maturityDate); return d !== null && d >= 0 && d <= 30; });
            const loansMatured = LOAN_FACILITIES.filter((l) => { const d = daysUntil(l.maturityDate); return d !== null && d < 0; });
            const loansSoon = LOAN_FACILITIES.filter((l) => { const d = daysUntil(l.maturityDate); return d !== null && d >= 0 && d <= 30; });
            const lines = [];
            lines.push(`Portfolio weekly digest — as of ${latest.date}`);
            lines.push("");
            lines.push(`Total assets:      ${fmt(totalAssets)} EGP`);
            lines.push(`Total liabilities: ${fmt(totalLiabilities)} EGP`);
            lines.push(`Net worth:         ${fmt(netWorth)} EGP`);
            lines.push(`Leverage:          ${leverage.toFixed(1)}%`);
            lines.push(`USD/EGP rate:      ${latest.rate}`);
            lines.push(`Gold, EGP/g:       ${latest.gold}`);
            if (prevDay) {
              lines.push("");
              lines.push(`Moves since ${prevDay.date}:`);
              lines.push(`  - Leverage: ${leverageDelta >= 0 ? "+" : "−"}${Math.abs(leverageDelta).toFixed(1)}pt`);
              if (rateDelta !== null) lines.push(`  - USD/EGP rate: ${signedPct(rateDelta)}`);
              if (goldDelta !== null) lines.push(`  - Gold: ${signedPct(goldDelta)}`);
            }
            const marketDays = Object.values(marketHistory).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));
            if (marketDays.length) {
              const currM = marketDays[marketDays.length - 1];
              const prevM = marketDays.length > 1 ? marketDays[marketDays.length - 2] : null;
              const MARKET_INSTRUMENTS = [
                { key: "oil", label: "Oil (WTI)" },
                { key: "sp500", label: "S&P 500" },
                { key: "nasdaq", label: "Nasdaq" },
                { key: "dow", label: "Dow Jones" },
                { key: "egx30", label: "EGX30" },
                { key: "egx70", label: "EGX70" }
              ];
              lines.push("");
              lines.push(`Markets, as of ${currM.date}:`);
              MARKET_INSTRUMENTS.forEach(({ key, label }) => {
                const val = currM[key];
                if (val === undefined || val === null) return;
                let deltaStr = "";
                if (prevM && prevM[key]) {
                  const delta = ((val - prevM[key]) / prevM[key]) * 100;
                  deltaStr = ` (${signedPct(delta)} since ${prevM.date})`;
                }
                lines.push(`  - ${label}: ${val.toLocaleString("en-US")}${deltaStr}`);
              });
            }
            if (matured.length) {
              lines.push("");
              lines.push(`Certificates past maturity (${matured.length}):`);
              matured.forEach((c) => lines.push(`  - ${c.label}, ${fmt(c.amount)} EGP, matured ${c.maturityDate}`));
            }
            if (soon.length) {
              lines.push("");
              lines.push(`Certificates maturing within 30 days (${soon.length}):`);
              soon.forEach((c) => lines.push(`  - ${c.label}, ${fmt(c.amount)} EGP, matures ${c.maturityDate}`));
            }
            if (loansMatured.length) {
              lines.push("");
              lines.push(`Loans past maturity (${loansMatured.length}):`);
              loansMatured.forEach((l) => lines.push(`  - ${l.label}, ${fmt(l.outstanding)} EGP outstanding, matured ${l.maturityDate}`));
            }
            if (loansSoon.length) {
              lines.push("");
              lines.push(`Loans maturing within 30 days (${loansSoon.length}):`);
              loansSoon.forEach((l) => lines.push(`  - ${l.label}, ${fmt(l.outstanding)} EGP outstanding, matures ${l.maturityDate}`));
            }
            const OFFICE_INSTALLMENT_SCHEDULE = [
              { date: "2026-09-16", amount: 17029500 },
              { date: "2026-12-16", amount: 9093753 },
              { date: "2027-03-16", amount: 9093753 },
              { date: "2027-06-16", amount: 9093753 },
              { date: "2027-09-16", amount: 9093753 },
              { date: "2027-12-16", amount: 9093753 },
              { date: "2028-03-16", amount: 9093753 },
              { date: "2028-06-16", amount: 9093753 },
              { date: "2028-09-16", amount: 9093753 },
              { date: "2028-12-16", amount: 9093753 },
              { date: "2029-03-16", amount: 9093753 },
              { date: "2029-06-16", amount: 9093753 },
              { date: "2029-09-16", amount: 9093753 },
              { date: "2029-12-16", amount: 9093753 },
              { date: "2030-03-16", amount: 9093753 },
              { date: "2030-06-16", amount: 34059000 },
              { date: "2030-09-16", amount: 9093753 },
              { date: "2030-12-16", amount: 9093753 },
              { date: "2031-03-16", amount: 9093753 },
              { date: "2031-06-16", amount: 26123253 },
              { date: "2031-09-16", amount: 9093753 },
              { date: "2031-12-16", amount: 9093753 },
              { date: "2032-03-16", amount: 9093753 },
              { date: "2032-06-16", amount: 9093753 },
              { date: "2032-09-16", amount: 9093753 },
              { date: "2032-12-16", amount: 9093753 },
              { date: "2033-03-16", amount: 9093753 },
              { date: "2033-06-16", amount: 9093753 },
              { date: "2033-09-16", amount: 9093753 },
              { date: "2033-12-16", amount: 9093753 },
              { date: "2034-03-16", amount: 9093753 },
              { date: "2034-06-16", amount: 8753163 }
            ];
            const todayStr = today.toISOString().slice(0, 10);
            const nextOfficeRow = OFFICE_INSTALLMENT_SCHEDULE.find((row) => row.date >= todayStr);
            if (nextOfficeRow) {
              const officeDaysUntil = Math.round((new Date(nextOfficeRow.date + "T00:00:00") - today) / 864e5);
              lines.push("");
              lines.push(`Next office installment: ${fmt(nextOfficeRow.amount)} EGP due ${nextOfficeRow.date} (in ${officeDaysUntil}d)`);
            }
            console.log(lines.join("\n"));
          ' "$DAILY" "$LOANS" "$HOLDINGS" "$MARKET_HISTORY" "$CERTS" "$LOAN_FACS")

          echo "$BODY"

          SUBJECT="Portfolio weekly digest — $(date -u +%Y-%m-%d)"
          printf 'From: %s\r\nTo: %s\r\nSubject: %s\r\n\r\n%s\r\n' "$MAIL_USERNAME" "$MAIL_TO" "$SUBJECT" "$BODY" > /tmp/mail.txt

          curl -sf --url 'smtps://smtp.gmail.com:465' \
            --ssl-reqd \
            --mail-from "$MAIL_USERNAME" \
            --mail-rcpt "$MAIL_TO" \
            --user "${MAIL_USERNAME}:${MAIL_APP_PASSWORD}" \
            --upload-file /tmp/mail.txt

          echo "Weekly digest sent."
