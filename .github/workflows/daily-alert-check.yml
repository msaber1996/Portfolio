name: Daily leverage/FX alert email

on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check leverage/FX thresholds and email/push if crossed
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          FIREBASE_API_KEY="AIzaSyCTbnNaSbxN57izkccidiiPh2WLInyc-hI"
          # Same low-privilege "service" account used by update-rates.yml — it only
          # needs read access here, which the database rules already grant to any
          # authenticated user.
          ID_TOKEN=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"rates-bot@portfolio.local","password":"o7TM8sgbx3sEqTRi92DgtsUL","returnSecureToken":true}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}" \
            | jq -r '.idToken')

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "Failed to get a Firebase auth token, aborting."
            exit 1
          fi

          DB="https://portfolio-8ac1d-default-rtdb.firebaseio.com"
          DAILY=$(curl -sf "${DB}/daily.json?auth=${ID_TOKEN}")
          LOANS=$(curl -sf "${DB}/loans.json?auth=${ID_TOKEN}")
          HOLDINGS=$(curl -sf "${DB}/holdings.json?auth=${ID_TOKEN}")
          LAST_OFFICE_ALERT=$(curl -sf "${DB}/serviceState/lastOfficeAlertDate.json?auth=${ID_TOKEN}")
          LAST_MATURITY_ALERTS=$(curl -sf "${DB}/serviceState/alertedMaturities.json?auth=${ID_TOKEN}")
          LIVE_RATES=$(curl -sf "${DB}/liveRates.json?auth=${ID_TOKEN}")
          # Tolerate marketHistory being unreadable (e.g. rules not republished
          # yet) instead of aborting the whole script under set -e — the
          # leverage/FX/office/maturity checks below don't depend on it.
          MARKET_HISTORY=$(curl -sf "${DB}/marketHistory.json?auth=${ID_TOKEN}" || echo "null")
          # certificates/loanFacilities live in Firebase now (the site's upload
          # features write there directly), not hardcoded here — read them fresh
          # each run so a statement upload is reflected in maturity alerts
          # immediately, with no separate file to keep in sync by hand.
          CERTS=$(curl -sf "${DB}/certificates.json?auth=${ID_TOKEN}" || echo "null")
          LOAN_FACS=$(curl -sf "${DB}/loanFacilities.json?auth=${ID_TOKEN}" || echo "null")

          # Mirrors the on-site banners (bundle.js: dailyAlert / officeDueAlert)
          # and the certificate-maturity highlighting (CertificatesTable) so the
          # site and this email stay in sync. Office installment schedule is the
          # real payment plan (office_deal_amr.xlsx), which has no upload feature
          # yet so it stays hardcoded here — keep it in sync with bundle.js and
          # weekly-digest.yml if that schedule ever changes.
          RESULT=$(node -e '
            const daily = JSON.parse(process.argv[1]) || {};
            const loans = JSON.parse(process.argv[2]) || {};
            const holdings = JSON.parse(process.argv[3]) || {};
            const lastOfficeAlert = JSON.parse(process.argv[4] || "null");
            const alertedMaturities = JSON.parse(process.argv[5] || "null") || {};
            const liveRates = JSON.parse(process.argv[6] || "null") || {};
            const marketHistory = JSON.parse(process.argv[7] || "null") || {};
            const CERTIFICATES = JSON.parse(process.argv[8] || "null") || [];
            const LOAN_FACILITIES = JSON.parse(process.argv[9] || "null") || [];
            const days = Object.values(daily).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));

            const triggers = [];

            function computeAssets(entry) {
              const rate = Number(entry.rate) || 0;
              const goldPrice = Number(entry.gold) || 0;
              let total = 0;
              Object.values(holdings).filter(Boolean).forEach((h) => {
                if (h.type === "fund") {
                  const raw = entry[h.navGroup];
                  const nav = raw !== undefined && raw !== "" ? Number(raw) : h.purchaseNav;
                  const current = h.purchaseNav ? (h.investment / h.purchaseNav) * nav : 0;
                  total += h.currency === "USD" ? current * rate : current;
                } else if (h.type === "gold") {
                  total += goldPrice * (h.grams || 0);
                } else {
                  total += h.currency === "USD" ? h.investment * rate : h.investment;
                }
              });
              return total;
            }
            function compareDays(prevDay, currDay, sinceLabel) {
              const totalLiabilities = Object.values(loans).filter(Boolean).reduce(
                (s, l) => s + (l.currency === "USD" ? l.amount * (Number(currDay.rate) || 0) : l.amount), 0
              );
              const prevAssets = computeAssets(prevDay);
              const currAssets = computeAssets(currDay);
              const prevLeverage = prevAssets ? (totalLiabilities / prevAssets) * 100 : 0;
              const currLeverage = currAssets ? (totalLiabilities / currAssets) * 100 : 0;
              const leverageDelta = currLeverage - prevLeverage;
              const rateDelta = prevDay.rate ? ((currDay.rate - prevDay.rate) / prevDay.rate) * 100 : 0;
              const goldDelta = prevDay.gold ? ((currDay.gold - prevDay.gold) / prevDay.gold) * 100 : 0;
              if (Math.abs(leverageDelta) >= 0.5) {
                triggers.push(`Leverage ${leverageDelta >= 0 ? "+" : "−"}${Math.abs(leverageDelta).toFixed(1)} points since ${sinceLabel} (now ${currLeverage.toFixed(1)}%)`);
              }
              if (Math.abs(rateDelta) >= 0.5) {
                triggers.push(`USD/EGP rate ${rateDelta >= 0 ? "+" : "−"}${Math.abs(rateDelta).toFixed(1)}% since ${sinceLabel} (now ${currDay.rate})`);
              }
              if (Math.abs(goldDelta) >= 0.5) {
                triggers.push(`Gold ${goldDelta >= 0 ? "+" : "−"}${Math.abs(goldDelta).toFixed(1)}% since ${sinceLabel} (now ${currDay.gold} EGP/g)`);
              }
            }

            // Saved-day-to-saved-day: catches moves between two entries someone
            // actually clicked "Save" on.
            if (days.length >= 2) {
              const prevDay = days[days.length - 2];
              const currDay = days[days.length - 1];
              compareDays(prevDay, currDay, prevDay.date);
            }

            // Live-vs-last-saved: the site only records a new /daily entry when
            // someone opens it and saves — on days nobody does that, the above
            // check has nothing new to compare, so real price moves went
            // unnoticed. This mirrors the live preview already shown on the
            // site (bundle.js: isLivePreview) by layering the live rate and
            // gold price onto the fund NAVs from the last saved day, so it
            // fires even without a manual save.
            // NOTE: no apostrophes and no single-quote characters allowed
            // anywhere in this comment block — it lives inside a bash
            // single-quoted string, which has no escape mechanism, so a
            // stray apostrophe here silently breaks the whole script with
            // a bash syntax error before any of this code even runs.
            if (days.length >= 1 && liveRates.rate && liveRates.gold) {
              const lastSaved = days[days.length - 1];
              const liveDay = { ...lastSaved, rate: liveRates.rate, gold: liveRates.gold };
              compareDays(lastSaved, liveDay, `${lastSaved.date} (live pricing)`);
            }

            // Market watch: oil and major indices are not part of any
            // holding (not counted in leverage), tracked purely for the
            // "Live markets" section on the site — a 0.5% day-over-day
            // move on any of them triggers. No apostrophes in this comment
            // either, for the same bash single-quote reason as above.
            const MARKET_INSTRUMENTS = [
              { key: "oil", label: "Oil (WTI)" },
              { key: "sp500", label: "S&P 500" },
              { key: "nasdaq", label: "Nasdaq" },
              { key: "dow", label: "Dow Jones" },
              { key: "egx30", label: "EGX30" },
              { key: "egx70", label: "EGX70" }
            ];
            const marketDays = Object.values(marketHistory).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));
            if (marketDays.length >= 2) {
              const prevM = marketDays[marketDays.length - 2];
              const currM = marketDays[marketDays.length - 1];
              MARKET_INSTRUMENTS.forEach(({ key, label }) => {
                const prevVal = Number(prevM[key]);
                const currVal = Number(currM[key]);
                if (!prevVal || !currVal) return;
                const delta = ((currVal - prevVal) / prevVal) * 100;
                if (Math.abs(delta) >= 0.5) {
                  triggers.push(`${label} ${delta >= 0 ? "+" : "−"}${Math.abs(delta).toFixed(1)}% since ${prevM.date} (now ${currVal.toLocaleString("en-US")})`);
                }
              });
            }

            const OFFICE_INSTALLMENT_SCHEDULE = [
              { date: "2026-09-16", amount: 17029500 },
              { date: "2026-12-16", amount: 9093753 },
              { date: "2027-03-16", amount: 9093753 },
              { date: "2027-06-16", amount: 9093753 },
              { date: "2027-09-16", amount: 9093753 },
              { date: "2027-12-16", amount: 9093753 },
              { date: "2028-03-16", amount: 9093753 },
              { date: "2028-06-16", amount: 9093753 },
              { date: "2028-09-16", amount: 9093753 },
              { date: "2028-12-16", amount: 9093753 },
              { date: "2029-03-16", amount: 9093753 },
              { date: "2029-06-16", amount: 9093753 },
              { date: "2029-09-16", amount: 9093753 },
              { date: "2029-12-16", amount: 9093753 },
              { date: "2030-03-16", amount: 9093753 },
              { date: "2030-06-16", amount: 34059000 },
              { date: "2030-09-16", amount: 9093753 },
              { date: "2030-12-16", amount: 9093753 },
              { date: "2031-03-16", amount: 9093753 },
              { date: "2031-06-16", amount: 26123253 },
              { date: "2031-09-16", amount: 9093753 },
              { date: "2031-12-16", amount: 9093753 },
              { date: "2032-03-16", amount: 9093753 },
              { date: "2032-06-16", amount: 9093753 },
              { date: "2032-09-16", amount: 9093753 },
              { date: "2032-12-16", amount: 9093753 },
              { date: "2033-03-16", amount: 9093753 },
              { date: "2033-06-16", amount: 9093753 },
              { date: "2033-09-16", amount: 9093753 },
              { date: "2033-12-16", amount: 9093753 },
              { date: "2034-03-16", amount: 9093753 },
              { date: "2034-06-16", amount: 8753163 }
            ];
            const OFFICE_DUE_WARNING_DAYS = 14;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = today.toISOString().slice(0, 10);
            const nextRow = OFFICE_INSTALLMENT_SCHEDULE.find((row) => row.date >= todayStr);
            let officeDueDate = null;
            if (nextRow) {
              const nextDue = new Date(nextRow.date + "T00:00:00");
              const daysUntilDue = Math.round((nextDue - today) / 864e5);
              if (daysUntilDue <= OFFICE_DUE_WARNING_DAYS && lastOfficeAlert !== nextRow.date) {
                officeDueDate = nextRow.date;
                const amt = Math.round(nextRow.amount).toLocaleString("en-US");
                triggers.push(daysUntilDue < 0
                  ? `Office installment: ${amt} EGP was due ${nextRow.date}, ${Math.abs(daysUntilDue)}d ago`
                  : daysUntilDue === 0
                  ? `Office installment: ${amt} EGP is due today (${nextRow.date})`
                  : `Office installment: ${amt} EGP due ${nextRow.date}, in ${daysUntilDue}d`);
              }
            }

            const MATURITY_WARNING_DAYS = 30;
            const daysUntilDate = (d) => d ? Math.round((new Date(d + "T00:00:00") - today) / 864e5) : null;
            const newMaturityAlerts = {};
            function checkMaturities(items, kind) {
              items.forEach((item, i) => {
                const d = daysUntilDate(item.maturityDate);
                if (d === null || d > MATURITY_WARNING_DAYS) return;
                const key = `${kind}:${i}`;
                if (alertedMaturities[key] === item.maturityDate) return;
                newMaturityAlerts[key] = item.maturityDate;
                const amt = Math.round(item.amount !== undefined ? item.amount : item.outstanding).toLocaleString("en-US");
                const noun = kind === "cert" ? "Certificate" : "Loan";
                triggers.push(d < 0
                  ? `${noun} matured: ${item.label}, ${amt} EGP, was due ${item.maturityDate}, ${Math.abs(d)}d ago`
                  : d === 0
                  ? `${noun} matures today: ${item.label}, ${amt} EGP (${item.maturityDate})`
                  : `${noun} matures soon: ${item.label}, ${amt} EGP, due ${item.maturityDate}, in ${d}d`);
              });
            }
            checkMaturities(CERTIFICATES, "cert");
            checkMaturities(LOAN_FACILITIES, "loan");

            console.log(JSON.stringify({ trigger: triggers.length > 0, triggers, date: days.length ? days[days.length - 1].date : (nextRow ? nextRow.date : todayStr), officeDueDate, newMaturityAlerts }));
          ' "$DAILY" "$LOANS" "$HOLDINGS" "$LAST_OFFICE_ALERT" "$LAST_MATURITY_ALERTS" "$LIVE_RATES" "$MARKET_HISTORY" "$CERTS" "$LOAN_FACS")

          echo "$RESULT"
          TRIGGER=$(echo "$RESULT" | jq -r '.trigger')
          if [ "$TRIGGER" != "true" ]; then
            echo "No threshold crossed today, not sending an email."
            exit 0
          fi

          if [ -z "${MAIL_USERNAME:-}" ] || [ -z "${MAIL_APP_PASSWORD:-}" ] || [ -z "${MAIL_TO:-}" ]; then
            echo "Threshold crossed, but MAIL_USERNAME/MAIL_APP_PASSWORD/MAIL_TO secrets aren't set yet — skipping email."
            exit 0
          fi

          SUBJECT="Portfolio alert: notable move on $(echo "$RESULT" | jq -r '.date')"
          BODY=$(echo "$RESULT" | jq -r '.triggers | join("\n")')

          printf 'From: %s\r\nTo: %s\r\nSubject: %s\r\n\r\n%s\r\n' "$MAIL_USERNAME" "$MAIL_TO" "$SUBJECT" "$BODY" > /tmp/mail.txt

          curl -sf --url 'smtps://smtp.gmail.com:465' \
            --ssl-reqd \
            --mail-from "$MAIL_USERNAME" \
            --mail-rcpt "$MAIL_TO" \
            --user "${MAIL_USERNAME}:${MAIL_APP_PASSWORD}" \
            --upload-file /tmp/mail.txt

          echo "Alert email sent."

          # Record office/maturity alert state BEFORE the push-notification
          # block below — a bad VAPID key or push-service error must never
          # cost us this bookkeeping (that would re-trigger the same office/
          # maturity alert every day until the push issue is fixed).
          OFFICE_DUE_DATE=$(echo "$RESULT" | jq -r '.officeDueDate')
          if [ "$OFFICE_DUE_DATE" != "null" ]; then
            curl -sf -X PUT -d "\"${OFFICE_DUE_DATE}\"" \
              "${DB}/serviceState/lastOfficeAlertDate.json?auth=${ID_TOKEN}" > /dev/null
            echo "Recorded office alert as sent for ${OFFICE_DUE_DATE}."
          fi

          NEW_MATURITY_ALERTS=$(echo "$RESULT" | jq -c '.newMaturityAlerts')
          if [ "$NEW_MATURITY_ALERTS" != "{}" ]; then
            MERGED_MATURITY_ALERTS=$(jq -n --argjson prev "$LAST_MATURITY_ALERTS" --argjson new "$NEW_MATURITY_ALERTS" '($prev // {}) + $new')
            curl -sf -X PUT -d "$MERGED_MATURITY_ALERTS" \
              "${DB}/serviceState/alertedMaturities.json?auth=${ID_TOKEN}" > /dev/null
            echo "Recorded maturity alerts as sent: $(echo "$MERGED_MATURITY_ALERTS" | jq -c .)"
          fi

          # --- Push notifications (Web Push), same trigger as the email above ---
          # Runs last and is fully isolated (explicit exit-code capture, never
          # relies on `|| true` alone) — a bad VAPID key or push-service error
          # here must never fail this job or block the bookkeeping above.
          if [ -n "${VAPID_PRIVATE_KEY:-}" ]; then
            VAPID_PUBLIC_KEY="BFhwCTvu6g58scgtSpAJxBtUMDj5Vt8UqjNlrNsdZ3mz1OA2wGHCWCx1MnU9S2YHlfQUMqFtOsrOBDpeQ76Wh6M"
            SUBSCRIPTIONS=$(curl -sf "${DB}/pushSubscriptions.json?auth=${ID_TOKEN}")
            if [ "$SUBSCRIPTIONS" != "null" ] && [ -n "$SUBSCRIPTIONS" ]; then
              npm install --no-save --silent web-push > /dev/null 2>&1
              PUSH_BODY=$(echo "$RESULT" | jq -r '.triggers | join(" · ")')
              set +e
              node -e '
                const webpush = require("web-push");
                const subs = JSON.parse(process.argv[1]) || {};
                const body = process.argv[2];
                try {
                  webpush.setVapidDetails("mailto:msaber1996@gmail.com", process.argv[3], process.argv[4]);
                } catch (e) {
                  console.error("Invalid VAPID key pair:", e.message);
                  process.exit(1);
                }
                const payload = JSON.stringify({ title: "Portfolio alert", body, url: "https://msaber1996.github.io/Portfolio/" });
                (async () => {
                  for (const [uid, sub] of Object.entries(subs)) {
                    try {
                      await webpush.sendNotification(sub, payload);
                    } catch (e) {
                      if (e.statusCode === 404 || e.statusCode === 410 || e.statusCode === 401 || e.statusCode === 403) console.log(`STALE_SUB:${uid}`);
                      else console.error(`Push failed for ${uid}:`, e.statusCode || e.message);
                    }
                  }
                })();
              ' "$SUBSCRIPTIONS" "$PUSH_BODY" "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" > /tmp/push_result.txt 2>&1
              NODE_EXIT=$?
              set -e
              cat /tmp/push_result.txt
              if [ "$NODE_EXIT" -ne 0 ]; then
                echo "Push notification script exited with code $NODE_EXIT — see output above. Not failing the job over this."
              fi
              grep '^STALE_SUB:' /tmp/push_result.txt | sed 's/^STALE_SUB://' | while read -r stale_uid; do
                curl -sf -X DELETE "${DB}/pushSubscriptions/${stale_uid}.json?auth=${ID_TOKEN}" > /dev/null || true
                echo "Removed stale push subscription for ${stale_uid}."
              done
              echo "Push notifications attempted."
            else
              echo "No push subscriptions to notify."
            fi
          else
            echo "VAPID_PRIVATE_KEY not set — skipping push notifications."
          fi
