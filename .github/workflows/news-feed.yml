name: Fetch economic news headlines

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch RSS feeds, push headlines to Firebase
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          # Google News RSS search — no API key needed, free, and lets us scope
          # each query by language/country (hl/gl/ceid) and recency (when:Nd).
          # Three buckets: high-volume Arabic/Egypt coverage, curated English
          # Egypt-business coverage, and global market-moving news (Fed, gold).
          fetch_feed() {
            curl -sfL -G "https://news.google.com/rss/search" \
              --data-urlencode "q=$1" \
              --data-urlencode "hl=$2" --data-urlencode "gl=$3" --data-urlencode "ceid=$3:$2" \
              -A "Mozilla/5.0" --max-time 20
          }

          AR_EGYPT=$(fetch_feed '("البورصة المصرية" OR "البنك المركزي المصري" OR "سعر الذهب" OR "سعر الفائدة" OR "الجنيه المصري") when:2d' ar EG || echo "")
          EN_EGYPT=$(fetch_feed '("Egyptian pound" OR "Egypt economy" OR "Central Bank of Egypt" OR EGX stock) when:4d' en-US US || echo "")
          EN_GLOBAL=$(fetch_feed '("Federal Reserve" rate decision OR gold price OR "interest rate decision") when:2d' en-US US || echo "")

          echo "$AR_EGYPT" > ar_egypt.xml
          echo "$EN_EGYPT" > en_egypt.xml
          echo "$EN_GLOBAL" > en_global.xml

          FIREBASE_API_KEY="AIzaSyCTbnNaSbxN57izkccidiiPh2WLInyc-hI"
          ID_TOKEN=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d '{"email":"rates-bot@portfolio.local","password":"o7TM8sgbx3sEqTRi92DgtsUL","returnSecureToken":true}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}" \
            | jq -r '.idToken')

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "Failed to get a Firebase auth token, aborting without writing."
            exit 1
          fi

          NEWS_JSON=$(node -e '
            const fs = require("fs");

            function decodeEntities(s) {
              return s
                .replace(/&amp;/g, "&")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .replace(/&quot;/g, "\"")
                .replace(/&#0?39;/g, "'"'"'")
                .replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
                .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(parseInt(d, 10)));
            }
            function stripCdata(s) {
              const m = s.match(/^<!\[CDATA\[([\s\S]*)\]\]>$/);
              return decodeEntities(m ? m[1] : s).trim();
            }
            // Known low-signal aggregator/ticker-spam domains — drop rather than
            // filter by keyword, since their titles otherwise look legitimate.
            const SOURCE_DENYLIST = ["tradingview", "binance", "moomoo", "ad-hoc-news", "biggo finance", "cryptorank", "beincrypto", "inkl"];
            function parseFeed(path, lang) {
              let xml;
              try { xml = fs.readFileSync(path, "utf8"); } catch { return []; }
              const items = [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)].map((m) => m[1]);
              return items.map((it) => {
                const rawTitle = (it.match(/<title>([\s\S]*?)<\/title>/) || [])[1] || "";
                const link = stripCdata((it.match(/<link>([\s\S]*?)<\/link>/) || [])[1] || "");
                const pubDate = ((it.match(/<pubDate>([\s\S]*?)<\/pubDate>/) || [])[1] || "").trim();
                const source = stripCdata((it.match(/<source[^>]*>([\s\S]*?)<\/source>/) || [])[1] || "");
                let title = stripCdata(rawTitle);
                if (source) {
                  for (const sep of [" - ", " | "]) {
                    if (title.endsWith(sep + source)) { title = title.slice(0, -(sep + source).length).trim(); break; }
                  }
                }
                return { title, link, source, pubDate, lang };
              }).filter((x) => x.title && x.link && x.source && !SOURCE_DENYLIST.some((d) => x.source.toLowerCase().includes(d)));
            }

            // Each bucket is already newest-first from Google News. A flat
            // merge-and-sort-by-date buries en_egypt/en_global under
            // ar_egypt, since gold-price articles post many times an hour —
            // so interleave round-robin across the 3 buckets instead, which
            // guarantees a mix in the visible top-N rather than pure
            // recency picking one bucket for every slot.
            const buckets = [
              parseFeed("ar_egypt.xml", "ar").slice(0, 14),
              parseFeed("en_egypt.xml", "en").slice(0, 10),
              parseFeed("en_global.xml", "en").slice(0, 8),
            ];
            const seen = new Set();
            const all = [];
            for (let i = 0; all.length < 30 && buckets.some((b) => i < b.length); i++) {
              for (const bucket of buckets) {
                if (i >= bucket.length) continue;
                const item = bucket[i];
                const key = item.title.trim().toLowerCase();
                if (seen.has(key)) continue;
                seen.add(key);
                all.push(item);
              }
            }
            console.log(JSON.stringify({ items: all.slice(0, 30), updatedAt: new Date().toISOString() }));
          ')

          echo "$NEWS_JSON" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const j=JSON.parse(d);console.log(`Fetched ${j.items.length} headlines.`);})'

          # Translate the English headlines to Arabic in one batched call (cheap:
          # one request, ~15-20 short titles) so the whole feed reads in Arabic —
          # the English original is kept alongside for reference/linking out.
          # Falls back to leaving English titles untranslated if the API call
          # fails for any reason, rather than losing the headlines entirely.
          NEWS_JSON=$(echo "$NEWS_JSON" | ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" node -e '
            let input = "";
            process.stdin.on("data", (c) => input += c);
            process.stdin.on("end", async () => {
              const data = JSON.parse(input);
              const enItems = data.items.filter((it) => it.lang === "en");
              if (!enItems.length || !process.env.ANTHROPIC_API_KEY) {
                console.log(JSON.stringify(data));
                return;
              }
              try {
                const prompt = `Translate each of these English news headlines into natural, concise Arabic (Modern Standard Arabic, news-style, as it would appear on an Arabic finance news site). Respond with ONLY a JSON array of strings, same order, same length as the input, no markdown fences, no other text.\n\n${JSON.stringify(enItems.map((it) => it.title))}`;
                const res = await fetch("https://api.anthropic.com/v1/messages", {
                  method: "POST",
                  headers: { "content-type": "application/json", "x-api-key": process.env.ANTHROPIC_API_KEY, "anthropic-version": "2023-06-01" },
                  body: JSON.stringify({ model: "claude-haiku-5-5", max_tokens: 2000, thinking: { type: "disabled" }, messages: [{ role: "user", content: prompt }] }),
                });
                if (!res.ok) throw new Error(`Anthropic API ${res.status}`);
                const json = await res.json();
                const text = (json.content || []).map((b) => b.text || "").join("").trim();
                const match = text.match(/\[[\s\S]*\]/);
                if (!match) throw new Error("no JSON array in response");
                const translated = JSON.parse(match[0]);
                if (!Array.isArray(translated) || translated.length !== enItems.length) throw new Error("translated array length mismatch");
                let i = 0;
                data.items = data.items.map((it) => it.lang === "en" ? { ...it, titleEn: it.title, title: translated[i++] } : it);
                console.error(`Translated ${enItems.length} English headline(s).`);
              } catch (e) {
                console.error(`Translation failed, leaving English headlines as-is: ${e.message}`);
              }
              console.log(JSON.stringify(data));
            });
          ')

          DB="https://portfolio-8ac1d-default-rtdb.firebaseio.com"
          echo "$NEWS_JSON" > news.json
          curl -sf -X PUT -d @news.json "${DB}/newsFeed.json?auth=${ID_TOKEN}" > /dev/null
          echo "Wrote newsFeed."
